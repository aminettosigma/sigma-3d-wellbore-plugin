<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D Well &amp; Completion Viewer</title>

  <!-- Sigma plugin SDK (UMD externalizes React, so React loads first) -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/@sigmacomputing/plugin@1.2.0/dist/umd/sigmacomputing-plugin.umd.js"></script>
  <!-- Plotly gl3d partial bundle (scatter3d / mesh3d / surface); full bundle is the fallback -->
  <script src="https://cdn.plot.ly/plotly-gl3d-2.35.2.min.js"></script>

  <style>
    .viz-root {
      color-scheme: light;
      --surface-1:      #fcfcfb;
      --surface-2:      #f4f3f0;
      --line:           #dedcd6;
      --text-primary:   #0b0b0b;
      --text-secondary: #52514e;
      --text-muted:     #8a8880;
      --accent:         #2a78d6;
      /* categorical slots, fixed order (validated) */
      --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100;
      --series-5:#e87ba4; --series-6:#008300; --series-7:#4a3aa7; --series-8:#e34948;
    }
    @media (prefers-color-scheme: dark) {
      :root:where(:not([data-theme="light"])) .viz-root {
        color-scheme: dark;
        --surface-1:#1a1a19; --surface-2:#232322; --line:#3a3a37;
        --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#8d8c83;
        --accent:#3987e5;
        --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500;
        --series-5:#d55181; --series-6:#008300; --series-7:#9085e9; --series-8:#e66767;
      }
    }
    :root[data-theme="dark"] .viz-root {
      color-scheme: dark;
      --surface-1:#1a1a19; --surface-2:#232322; --line:#3a3a37;
      --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#8d8c83;
      --accent:#3987e5;
      --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500;
      --series-5:#d55181; --series-6:#008300; --series-7:#9085e9; --series-8:#e66767;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      color: var(--text-primary);
      background: var(--surface-1);
    }
    #app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* ---------- author toolbar (edit mode only) ---------- */
    #toolbar { display: none; flex: 0 0 auto; background: var(--surface-2);
               border-bottom: 1px solid var(--line); padding: 8px 10px; }
    #toolbar.show { display: block; }
    #toolbar .row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }
    #toolbar .grp { display: flex; flex-direction: column; gap: 3px; }
    #toolbar .grp > span { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em;
                           color: var(--text-muted); }
    #toolbar .sec { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em;
                    color: var(--text-secondary); font-weight: 600; margin: 8px 0 4px; }
    #toolbar .spacer { flex: 1 1 auto; }

    select, input[type="text"], input[type="number"] {
      font: inherit; font-size: 12px; color: var(--text-primary);
      background: var(--surface-1); border: 1px solid var(--line);
      border-radius: 5px; padding: 4px 6px; max-width: 190px;
    }
    button.btn {
      font: inherit; font-size: 12px; cursor: pointer;
      background: var(--surface-1); color: var(--text-primary);
      border: 1px solid var(--line); border-radius: 5px; padding: 5px 10px;
    }
    button.btn:hover { background: var(--surface-2); }
    button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.btn.primary:hover { filter: brightness(.93); }
    label.chk { display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
                color: var(--text-secondary); font-size: 12px; white-space: nowrap; }

    /* ---------- stage ---------- */
    #stage { position: relative; flex: 1 1 auto; min-height: 0; }
    #plot { position: absolute; inset: 0; }

    /* ---------- viewer control panel ---------- */
    #panel {
      position: absolute; top: 10px; left: 10px; z-index: 5; width: 200px;
      max-height: calc(100% - 20px); overflow: auto;
      background: color-mix(in srgb, var(--surface-1) 92%, transparent);
      border: 1px solid var(--line); border-radius: 8px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      backdrop-filter: blur(4px);
    }
    #panel.collapsed #panelBody { display: none; }
    #panelHead {
      display: flex; align-items: center; gap: 6px; cursor: pointer;
      padding: 7px 9px; border-bottom: 1px solid var(--line);
      font-size: 11px; font-weight: 600; letter-spacing: .04em;
      text-transform: uppercase; color: var(--text-secondary);
    }
    #panel.collapsed #panelHead { border-bottom: none; }
    #panelHead .caret { margin-left: auto; color: var(--text-muted); font-size: 10px; }
    #panelBody { padding: 9px; display: flex; flex-direction: column; gap: 10px; }
    .fld { display: flex; flex-direction: column; gap: 4px; }
    .fld > label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em;
                   color: var(--text-muted); }
    .fld select { max-width: none; width: 100%; }
    .fld input[type="range"] { width: 100%; accent-color: var(--accent); }
    .rowline { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .rowline .val { font-variant-numeric: tabular-nums; color: var(--text-secondary); font-size: 11.5px; }
    .btnrow { display: flex; gap: 5px; }
    .btnrow button { flex: 1 1 0; padding: 4px 0; font-size: 11.5px; }
    .wells { border: 1px solid var(--line); border-radius: 6px; max-height: 168px;
             overflow: auto; background: var(--surface-1); }
    .wells .w { display: flex; align-items: center; gap: 6px; padding: 3px 7px;
                cursor: pointer; font-size: 12px; }
    .wells .w:hover { background: var(--surface-2); }
    .wells .w .sw { width: 9px; height: 9px; border-radius: 2px; flex: 0 0 auto;
                    box-shadow: 0 0 0 1px var(--surface-1); }
    .wells .w .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 auto; }
    .wells .w input.vis { margin: 0; flex: 0 0 auto; cursor: pointer; }
    .wells .w.off { opacity: .42; }
    .wells .w.sel { background: color-mix(in srgb, var(--accent) 13%, transparent); font-weight: 600; }
    .hint { font-size: 11px; color: var(--text-muted); line-height: 1.35; }
    .selchip {
      display: none; position: absolute; top: 10px; right: 10px; z-index: 5;
      align-items: center; gap: 7px; font-size: 12px;
      background: color-mix(in srgb, var(--surface-1) 92%, transparent);
      border: 1px solid var(--line); border-radius: 999px; padding: 5px 6px 5px 11px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }
    .selchip.show { display: flex; }
    .selchip b { font-weight: 600; }
    .selchip button { border: none; background: var(--surface-2); color: var(--text-secondary);
                      border-radius: 999px; width: 19px; height: 19px; cursor: pointer;
                      font-size: 12px; line-height: 1; }

    /* ---------- empty / error state ---------- */
    #msg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
           text-align: center; padding: 28px; z-index: 6; background: var(--surface-1); }
    #msg.show { display: flex; }
    #msg .box { max-width: 430px; }
    #msg .big { font-size: 15px; font-weight: 600; margin-bottom: 7px; }
    #msg .sub { font-size: 12.5px; color: var(--text-secondary); line-height: 1.5; }
    #msg code { background: var(--surface-2); padding: 1px 4px; border-radius: 3px; font-size: 11.5px; }
    .modebar { padding-top: 2px; }
  </style>
</head>
<body class="viz-root">
  <div id="app">
    <div id="toolbar"></div>
    <div id="stage">
      <div id="plot"></div>
      <div id="panel"><div id="panelHead"><span>View controls</span><span class="caret">▾</span></div><div id="panelBody"></div></div>
      <div class="selchip" id="selchip"></div>
      <div id="msg"><div class="box"><div class="big"></div><div class="sub"></div></div></div>
    </div>
  </div>

  <script>
  (function () {
    "use strict";

    /* =====================================================================
       0. SDK + Plotly bootstrap
       ===================================================================== */
    var SDK = window.SigmaPlugin ||
              (window.sigmaComputing && window.sigmaComputing.plugin) ||
              window["@sigmacomputing/plugin"];

    var msgEl = document.getElementById("msg");
    function showMsg(big, sub) {
      msgEl.querySelector(".big").textContent = big;
      msgEl.querySelector(".sub").innerHTML = sub || "";
      msgEl.classList.add("show");
    }
    function hideMsg() { msgEl.classList.remove("show"); }

    // The SDK loads fine outside Sigma, but no config ever arrives unless we're the workbook's
    // iframe — so treat "top-level window" as standalone preview and fall back to demo wells.
    var inSigma = !!(SDK && SDK.client) && window.parent !== window;
    var client = inSigma ? SDK.client : null;
    var gotConfig = false;

    // Plotly partial bundle may be blocked by a proxy — fall back to the full build.
    function ensurePlotly(cb) {
      if (window.Plotly) return cb();
      var s = document.createElement("script");
      s.src = "https://cdn.plot.ly/plotly-2.35.2.min.js";
      s.onload = cb;
      s.onerror = function () {
        showMsg("3D engine failed to load",
          "Plotly could not be fetched from <code>cdn.plot.ly</code>. If this Sigma org blocks external CDNs, " +
          "host <code>plotly-gl3d-2.35.2.min.js</code> alongside this plugin and point the &lt;script&gt; tag at it.");
      };
      document.head.appendChild(s);
    }

    /* =====================================================================
       1. Editor panel
       ===================================================================== */
    if (inSigma) {
      client.config.configureEditorPanel([
        { name: "source", type: "element" },
        { name: "columns", type: "column", source: "source", allowMultiple: true,
          label: "Well survey columns" },
        { name: "surfaceSource", type: "element" },
        { name: "surfaceColumns", type: "column", source: "surfaceSource", allowMultiple: true,
          label: "Formation grid columns (optional)" },
        { name: "wellVar", type: "variable", allowedTypes: ["text"],
          label: "Clicked well → control (optional)" },
        { name: "onSelect", type: "action-trigger",
          label: "Clicked well → action (optional)" },
        { name: "layerVar", type: "variable", allowedTypes: ["text"],
          label: "Selected layer → control (optional)" },
        { name: "config", type: "text", multiline: true, defaultValue: "",
          label: "Viewer config (JSON — managed by the plugin)" },
        { name: "editMode", type: "toggle", label: "Edit mode (show mapping panel)" },
        { name: "demo", type: "toggle", label: "Use built-in demo wells" }
      ]);
    }

    /* =====================================================================
       2. Palettes (dataviz reference instance)
       ===================================================================== */
    var CAT = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100",
               "#e87ba4", "#008300", "#4a3aa7", "#e34948"];
    var CAT_DARK = ["#3987e5", "#d95926", "#199e70", "#c98500",
                    "#d55181", "#008300", "#9085e9", "#e66767"];
    var OTHER = "#8a8880";                    // wells past slot 8 — identity comes from labels
    var SEQ_BLUE = [[0, "#cde2fb"], [0.25, "#86b6ef"], [0.5, "#3987e5"],
                    [0.75, "#256abf"], [1, "#0d366b"]];
    var SEQ_ORANGE = [[0, "#fbe0cf"], [0.25, "#f5b183"], [0.5, "#eb6834"],
                      [0.75, "#b8471c"], [1, "#7d2f11"]];
    // Line marks need a floor-lifted ramp: the lightest sequential step and the gray diverging
    // midpoint both recede into the surface at 2px, so lines start at step 250 / a mid gray.
    var SEQ_LINE = [[0, "#86b6ef"], [0.33, "#3987e5"], [0.66, "#256abf"], [1, "#0d366b"]];
    var SEQ_LINE_DARK = [[0, "#cde2fb"], [0.33, "#9ec5f4"], [0.66, "#5598e7"], [1, "#184f95"]];
    var DIV_LINE = [[0, "#0d366b"], [0.25, "#3987e5"], [0.42, "#86b6ef"], [0.5, "#a8a6a0"],
                    [0.58, "#f0a09f"], [0.75, "#e34948"], [1, "#7d1f1e"]];
    var DIV_LINE_DARK = [[0, "#184f95"], [0.25, "#3987e5"], [0.42, "#9ec5f4"], [0.5, "#9a9990"],
                         [0.58, "#f0a09f"], [0.75, "#e66767"], [1, "#8f2726"]];
    // diverging: blue ↔ red poles, neutral gray midpoint (red arm mirrors the blue arm's lightness)
    var DIV = [[0, "#0d366b"], [0.18, "#256abf"], [0.36, "#86b6ef"],
               [0.5, "#f0efec"],
               [0.64, "#f0a09f"], [0.82, "#e34948"], [1, "#7d1f1e"]];
    var DIV_DARK = [[0, "#184f95"], [0.18, "#3987e5"], [0.36, "#9ec5f4"],
                    [0.5, "#383835"],
                    [0.64, "#f0a09f"], [0.82, "#e66767"], [1, "#8f2726"]];

    function dark() {
      return matchMedia && matchMedia("(prefers-color-scheme: dark)").matches &&
             document.documentElement.getAttribute("data-theme") !== "light";
    }
    function cssv(n, fb) {
      var v = getComputedStyle(document.body).getPropertyValue(n);
      return (v && v.trim()) || fb;
    }
    function catColor(i) { return (dark() ? CAT_DARK : CAT)[i] || OTHER; }
    function scaleFor(kind) {
      if (kind === "div") return dark() ? DIV_DARK : DIV;
      if (kind === "divLine") return dark() ? DIV_LINE_DARK : DIV_LINE;
      if (kind === "seqLine") return dark() ? SEQ_LINE_DARK : SEQ_LINE;
      if (kind === "seq2") return SEQ_ORANGE;
      return SEQ_BLUE;
    }

    /* =====================================================================
       3. State
       ===================================================================== */
    var DEFAULTS = {
      version: 1,
      map:  { well: "", x: "", y: "", z: "", md: "", color: "",
              stageSize: "", stageLabel: "", tooltip: [] },
      surf: { layer: "", x: "", y: "", z: "", value: "" },
      view: { zExag: 1, trueScale: false, scale: "auto", lineWidth: 5, markerScale: 1,
              showStages: true, showSurface: true, showLabels: true, showFootprint: false,
              projection: "perspective", layer: "", camera: null, camAR: "" }
    };

    var CONFIG   = {};          // editor-panel values
    var COLS = {}, DATA = {};   // survey element metadata + column-oriented data
    var SCOLS = {}, SDATA = {}; // formation-grid element metadata + data
    var SETTINGS = clone(DEFAULTS);
    var VIEW = clone(DEFAULTS.view);   // ephemeral viewer state (seeded from saved defaults)
    var unsubD = null, unsubC = null, unsubSD = null, unsubSC = null;
    var curSrc = null, curSurfSrc = null;
    var selectedWell = null;
    var clickedAt = 0;
    var hiddenWells = {};
    var wellOrder = [];         // stable, sorted — color follows the well, not its rank
    var autoMapped = false, colsSynced = false, plotReady = false, demoMode = false;
    var loading = false, loadTimer = null;
    var panelCollapsed = false;

    var stage = document.getElementById("stage");
    var plotEl = document.getElementById("plot");
    var toolbar = document.getElementById("toolbar");
    var panel = document.getElementById("panel");
    var panelBody = document.getElementById("panelBody");
    var selchip = document.getElementById("selchip");

    /* =====================================================================
       4. Helpers
       ===================================================================== */
    function clone(o) { return JSON.parse(JSON.stringify(o)); }
    function esc(s) {
      return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function num(v) {
      if (v == null || v === "") return null;
      var n = typeof v === "number" ? v : Number(v);
      return isFinite(n) ? n : null;
    }
    function arr(c) { return Array.isArray(c) ? c.slice() : (c ? [c] : []); }
    function colName(id, meta) { return (meta && meta[id] && meta[id].name) || id; }
    function rowCount(d) {
      var n = 0;
      Object.keys(d || {}).forEach(function (k) { if (Array.isArray(d[k])) n = Math.max(n, d[k].length); });
      return n;
    }
    function deepMerge(base, over) {
      var out = clone(base);
      Object.keys(over || {}).forEach(function (k) {
        var v = over[k];
        if (v && typeof v === "object" && !Array.isArray(v) && out[k] && typeof out[k] === "object" && !Array.isArray(out[k]))
          out[k] = deepMerge(out[k], v);
        else if (v !== undefined) out[k] = v;
      });
      return out;
    }
    // Format a value using Sigma's column format metadata when present.
    function fmt(v, id, meta) {
      if (v == null) return "—";
      if (typeof v !== "number") return String(v);
      var f = meta && meta[id] && meta[id].format;
      var dec = 2, pre = "", suf = "";
      if (f) {
        var m = /\.(\d+)/.exec(f.format || "");
        if (m) dec = Math.min(6, +m[1]);
        if (f.type === "currency") pre = "$";
        if (f.type === "percent") { suf = "%"; v = v * 100; }
        if (f.type === "compact" && Math.abs(v) >= 1000) {
          var u = ["", "K", "M", "B"], i = 0, x = v;
          while (Math.abs(x) >= 1000 && i < 3) { x /= 1000; i++; }
          return pre + x.toFixed(1) + u[i] + suf;
        }
      } else {
        var a = Math.abs(v);
        dec = a >= 1000 ? 0 : a >= 10 ? 1 : a >= 1 ? 2 : 3;
      }
      return pre + v.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: dec }) + suf;
    }
    function extent(vals) {
      var lo = Infinity, hi = -Infinity;
      for (var i = 0; i < vals.length; i++) { var v = vals[i]; if (v == null) continue; if (v < lo) lo = v; if (v > hi) hi = v; }
      return lo <= hi ? [lo, hi] : [0, 1];
    }
    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    function setLoading(on) {
      if (!inSigma || on === loading) return;
      loading = on;
      try {
        if (client.config && typeof client.config.setLoadingState === "function")
          client.config.setLoadingState(on);
        else if (typeof client.setLoadingState === "function") client.setLoadingState(on);
      } catch (e) { /* older SDK — nothing to signal */ }
    }
    function beginLoading() {
      setLoading(true);
      clearTimeout(loadTimer);
      loadTimer = setTimeout(function () { setLoading(false); }, 12000);  // never spin forever
    }
    function endLoading() { clearTimeout(loadTimer); setLoading(false); }

    /* =====================================================================
       5. Demo data — realistic pad of unconventional wells + formation grids
       ===================================================================== */
    var DEMO = null, DEMO_S = null;
    function seeded(s) { return function () { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; }; }
    function buildDemo() {
      if (DEMO) return;
      var rnd = seeded(97);
      var wells = [], surveys = { well: [], pad: [], formation: [], md: [], x: [], y: [], z: [],
                                  dls: [], rop: [], stage: [], prop: [], isip: [] };
      var forms = ["WCA", "AVU", "SBL"];
      var pads = ["Bravo 12", "Bravo 12", "Bravo 12", "Delta 7", "Delta 7", "Delta 7",
                  "Echo 3", "Echo 3", "Echo 3", "Echo 3"];
      for (var w = 0; w < 10; w++) {
        var name = ["MID-A1H","MID-A2H","MID-A3H","MID-B1H","MID-B2H","MID-B3H",
                    "MID-C1H","MID-C2H","MID-C3H","MID-C4H"][w];
        var padX = [402000, 402000, 402000, 404800, 404800, 404800, 407200, 407200, 407200, 407200][w];
        var padY = [406500, 406500, 406500, 409200, 409200, 409200, 411500, 411500, 411500, 411500][w];
        var offs = (w % 3 - 1) * 660 + (w > 8 ? 660 : 0);
        var azi = (w < 3 ? 12 : w < 6 ? 358 : 6) * Math.PI / 180;
        var kop = 6200 + rnd() * 400;                 // kick-off point
        var landing = 9100 + rnd() * 500;             // TVD of the landing zone
        var lateral = 8200 + rnd() * 2400;
        var form = forms[w % 3];
        var md = 0, tvd = 0, inc = 0, x = padX + offs * Math.cos(azi), y = padY + offs * Math.sin(azi);
        var stg = 0, nextStage = 0;
        while (md < kop + 2200 + lateral) {
          md += 100;
          var target = md < kop ? 0 : Math.min(90, (md - kop) / 2200 * 90);
          var build = (target - inc) * 0.55 + (rnd() - 0.5) * 1.1;
          inc = clamp(inc + build, 0, 92);
          var r = inc * Math.PI / 180;
          tvd += 100 * Math.cos(r);
          x += 100 * Math.sin(r) * Math.sin(azi + (rnd() - 0.5) * 0.03);
          y += 100 * Math.sin(r) * Math.cos(azi + (rnd() - 0.5) * 0.03);
          var dls = Math.abs(build) / 1 + (rnd() * 0.35);
          var isLat = inc > 87;
          var isStage = false;
          if (isLat) { if (md >= nextStage) { stg++; nextStage = md + 200; isStage = true; } }
          surveys.well.push(name); surveys.pad.push(pads[w]); surveys.formation.push(form);
          surveys.md.push(Math.round(md));
          surveys.x.push(Math.round(x * 10) / 10);
          surveys.y.push(Math.round(y * 10) / 10);
          surveys.z.push(Math.round(tvd * 10) / 10);
          surveys.dls.push(Math.round(dls * 100) / 100);
          surveys.rop.push(Math.round((isLat ? 62 + rnd() * 38 : 24 + rnd() * 26) * 10) / 10);
          surveys.stage.push(isStage ? stg : null);
          surveys.prop.push(isStage ? Math.round(340000 + rnd() * 260000) : null);
          surveys.isip.push(isStage ? Math.round(6100 + rnd() * 1400) : null);
          if (tvd > landing + 60 && inc > 89) inc = 90;
        }
        wells.push(name);
      }
      DEMO = surveys;

      // formation grids: one 12×12 lattice per formation, metric = average build rate
      var grid = { formation: [], x: [], y: [], z: [], build: [] };
      for (var f = 0; f < forms.length; f++) {
        var base = 8600 + f * 620;
        for (var i = 0; i <= 12; i++) for (var j = 0; j <= 12; j++) {
          var gx = 400500 + i * 700, gy = 405200 + j * 620;
          grid.formation.push(forms[f]);
          grid.x.push(gx); grid.y.push(gy);
          grid.z.push(Math.round(base + 140 * Math.sin(i / 3.1) + 95 * Math.cos(j / 2.6) + rnd() * 30));
          grid.build.push(Math.round((0.18 * Math.sin(i / 2.4 + f) + 0.13 * Math.cos(j / 3.2) + (rnd() - 0.5) * 0.05) * 1000) / 1000);
        }
      }
      DEMO_S = grid;
    }
    var DEMO_COLS = {
      well: { name: "Well", columnType: "text" }, pad: { name: "Pad", columnType: "text" },
      formation: { name: "Target Formation", columnType: "text" },
      md: { name: "MD (ft)", columnType: "number", format: { type: "number", format: ",.0f" } },
      x: { name: "Easting (ft)", columnType: "number", format: { type: "number", format: ",.0f" } },
      y: { name: "Northing (ft)", columnType: "number", format: { type: "number", format: ",.0f" } },
      z: { name: "TVD (ft)", columnType: "number", format: { type: "number", format: ",.0f" } },
      dls: { name: "Dogleg Severity (°/100ft)", columnType: "number", format: { type: "number", format: ".2f" } },
      rop: { name: "ROP (ft/hr)", columnType: "number", format: { type: "number", format: ".1f" } },
      stage: { name: "Frac Stage", columnType: "integer" },
      prop: { name: "Proppant (lbs)", columnType: "number", format: { type: "compact", format: ",.0f" } },
      isip: { name: "ISIP (psi)", columnType: "number", format: { type: "number", format: ",.0f" } }
    };
    var DEMO_SCOLS = {
      formation: { name: "Formation", columnType: "text" },
      x: { name: "Easting (ft)", columnType: "number" },
      y: { name: "Northing (ft)", columnType: "number" },
      z: { name: "Top TVD (ft)", columnType: "number", format: { type: "number", format: ",.0f" } },
      build: { name: "Avg Build Rate (°/100ft)", columnType: "number", format: { type: "number", format: ".3f" } }
    };
    var DEMO_MAP = {
      map: { well: "well", x: "x", y: "y", z: "z", md: "md", color: "dls",
             stageSize: "prop", stageLabel: "stage", tooltip: ["rop", "isip", "formation", "pad"] },
      surf: { layer: "formation", x: "x", y: "y", z: "z", value: "build" }
    };

    /* =====================================================================
       6. Shape the survey rows into wells
       ===================================================================== */
    var MAX_PTS_PER_WELL = 3000;   // decimate very long survey lists so orbiting stays smooth

    function buildWells() {
      var m = SETTINGS.map;
      var xs = DATA[m.x], ys = DATA[m.y], zs = DATA[m.z];
      if (!xs || !ys || !zs) return [];
      var wcol = m.well ? DATA[m.well] : null;
      var mdcol = m.md ? DATA[m.md] : null;
      var n = Math.min(xs.length, ys.length, zs.length);
      var groups = {}, order = [];
      for (var i = 0; i < n; i++) {
        if (num(xs[i]) == null || num(ys[i]) == null || num(zs[i]) == null) continue;
        var w = wcol ? String(wcol[i] == null ? "—" : wcol[i]) : "All rows";
        if (!groups[w]) { groups[w] = []; order.push(w); }
        groups[w].push(i);
      }
      // stable colour assignment: sorted well list, independent of any filter
      wellOrder = order.slice().sort(function (a, b) { return a.localeCompare(b, undefined, { numeric: true }); });
      return wellOrder.map(function (name, k) {
        var full = groups[name], idx = full;
        if (mdcol) full.sort(function (a, b) { return (num(mdcol[a]) || 0) - (num(mdcol[b]) || 0); });
        if (full.length > MAX_PTS_PER_WELL) {
          var step = Math.ceil(full.length / MAX_PTS_PER_WELL), keep = [];
          for (var j = 0; j < full.length; j += step) keep.push(full[j]);
          if (keep[keep.length - 1] !== full[full.length - 1]) keep.push(full[full.length - 1]);
          idx = keep;
        }
        return { name: name, idx: idx, full: full, slot: k, color: k < 8 ? catColor(k) : OTHER };
      });
    }

    function layerValues() {
      var lc = SETTINGS.surf.layer;
      if (!lc || !SDATA[lc]) return [];
      var seen = {}, out = [];
      SDATA[lc].forEach(function (v) {
        var s = v == null ? "" : String(v);
        if (s && !seen[s]) { seen[s] = 1; out.push(s); }
      });
      return out.sort(function (a, b) { return a.localeCompare(b, undefined, { numeric: true }); });
    }

    /* =====================================================================
       7. Traces
       ===================================================================== */
    function tplSafe(s) { return String(s == null ? "" : s).replace(/[<>]/g, ""); }
    function hoverTpl(m, meta) {
      // customdata: [well, md, colorVal, ...tooltip cols]
      var t = "<b>%{customdata[0]}</b><br>";
      if (m.md) t += tplSafe(colName(m.md, meta)) + ": %{customdata[1]}<br>";
      if (m.color) t += tplSafe(colName(m.color, meta)) + ": <b>%{customdata[2]}</b><br>";
      SETTINGS.map.tooltip.forEach(function (c, i) {
        t += tplSafe(colName(c, meta)) + ": %{customdata[" + (3 + i) + "]}<br>";
      });
      t += "<span style='opacity:.7'>E %{x:,.0f} · N %{y:,.0f} · TVD %{z:,.0f}</span><extra></extra>";
      return t;
    }

    function customFor(i, m) {
      var row = [m.well ? String(DATA[m.well] ? DATA[m.well][i] : "") : "All rows",
                 m.md ? fmt(num(DATA[m.md] ? DATA[m.md][i] : null), m.md, COLS) : "",
                 m.color ? fmt(num(DATA[m.color] ? DATA[m.color][i] : null), m.color, COLS) : ""];
      m.tooltip.forEach(function (c) {
        var v = DATA[c] ? DATA[c][i] : null;
        row.push(typeof v === "number" ? fmt(v, c, COLS) : (v == null ? "—" : String(v)));
      });
      return row;
    }

    function pickScale(lo, hi, forLine) {
      var seq = forLine ? "seqLine" : "seq", div = forLine ? "divLine" : "div";
      if (VIEW.scale === "seq") return { s: scaleFor(seq), lo: lo, hi: hi };
      if (VIEW.scale === "div") {
        var a = Math.max(Math.abs(lo), Math.abs(hi));
        return { s: scaleFor(div), lo: -a, hi: a };
      }
      // auto: polarity → diverging around zero; pure magnitude → one-hue sequential
      if (lo < 0 && hi > 0) {
        var b = Math.max(Math.abs(lo), Math.abs(hi));
        return { s: scaleFor(div), lo: -b, hi: b };
      }
      return { s: scaleFor(seq), lo: lo, hi: hi };
    }

    // One place decides how much paper width the colour bars take, so the scene domain,
    // the bars and the legend all agree.
    function cbGeom() {
      var m = SETTINGS.map, s = SETTINGS.surf;
      var hasMetric = !!(m.color && DATA[m.color]);
      var hasSurf = !!(VIEW.showSurface && s.x && s.y && s.z && SDATA[s.x] && VIEW.layer);
      var n = (hasMetric ? 1 : 0) + (hasSurf ? 1 : 0);
      var reserve = n * 0.105;
      return {
        hasMetric: hasMetric, hasSurf: hasSurf, reserve: reserve,
        metricX: 1 - reserve + 0.02,
        surfX: 1 - reserve + (hasMetric ? 0.115 : 0.02)
      };
    }

    function buildTraces(wells) {
      var m = SETTINGS.map, s = SETTINGS.surf;
      var traces = [], vis = wells.filter(function (w) { return !hiddenWells[w.name]; });
      var xs = DATA[m.x], ys = DATA[m.y], zs = DATA[m.z];
      var tpl = hoverTpl(m, COLS);
      var ink = cssv("--text-secondary", "#52514e");

      /* --- colour scale for the trajectory metric --- */
      var metric = null;
      if (m.color && DATA[m.color]) {
        var all = [];
        vis.forEach(function (w) { w.idx.forEach(function (i) { all.push(num(DATA[m.color][i])); }); });
        var e = extent(all);
        metric = pickScale(e[0], e[1], true);   // line-safe ramp
        metric.title = colName(m.color, COLS);
      }
      var geom = cbGeom();
      var surfaceOn = geom.hasSurf;
      var metricCbDone = false;      // exactly one trace owns the metric colorbar

      /* --- formation grid (mesh3d) --- */
      if (surfaceOn) {
        var lc = s.layer, sv = s.value;
        var gx = [], gy = [], gz = [], gi = [];
        var sn = Math.min(SDATA[s.x].length, SDATA[s.y].length, SDATA[s.z].length);
        for (var i = 0; i < sn; i++) {
          if (lc && String(SDATA[lc][i]) !== VIEW.layer) continue;
          var px = num(SDATA[s.x][i]), py = num(SDATA[s.y][i]), pz = num(SDATA[s.z][i]);
          if (px == null || py == null || pz == null) continue;
          gx.push(px); gy.push(py); gz.push(pz);
          gi.push(sv ? num(SDATA[sv][i]) : pz);
        }
        if (gx.length >= 3) {
          var se = extent(gi), ss = pickScale(se[0], se[1], false);
          traces.push({
            type: "mesh3d", name: VIEW.layer, x: gx, y: gy, z: gz,
            intensity: gi, colorscale: ss.s, cmin: ss.lo, cmax: ss.hi,
            delaunayaxis: "z", opacity: 0.72, flatshading: false, hoverinfo: "skip",
            showscale: true, showlegend: false,
            lighting: { ambient: 0.85, diffuse: 0.5, specular: 0.05, roughness: 0.9 },
            colorbar: {
              title: { text: (sv ? colName(sv, SCOLS) : "Top TVD") + "<br>" + VIEW.layer, side: "right",
                       font: { size: 10.5, color: ink } },
              x: geom.surfX, len: 0.55, thickness: 13, y: 0.5,
              tickfont: { size: 10, color: ink }, outlinewidth: 0
            }
          });
        }
      }

      /* --- plan-view footprint on the base plane --- */
      if (VIEW.showFootprint) {
        var zAll = [];
        vis.forEach(function (w) { w.idx.forEach(function (i) { zAll.push(num(zs[i])); }); });
        var zBottom = extent(zAll)[1];
        vis.forEach(function (w) {
          traces.push({
            type: "scatter3d", mode: "lines", name: w.name + " (plan)",
            x: w.idx.map(function (i) { return num(xs[i]); }),
            y: w.idx.map(function (i) { return num(ys[i]); }),
            z: w.idx.map(function () { return zBottom; }),
            line: { color: cssv("--line", "#dedcd6"), width: 2 },
            opacity: 0.9, hoverinfo: "skip", showlegend: false
          });
        });
      }

      /* --- trajectories --- */
      vis.forEach(function (w) {
        var dim = selectedWell && selectedWell !== w.name;
        var line = { width: (selectedWell === w.name ? SETTINGS.view.lineWidth + 3 : SETTINGS.view.lineWidth) };
        if (metric) {
          line.color = w.idx.map(function (i) { return num(DATA[m.color][i]); });
          line.colorscale = metric.s; line.cmin = metric.lo; line.cmax = metric.hi;
          line.showscale = !metricCbDone;
          if (line.showscale) {
            metricCbDone = true;
            line.colorbar = {
              title: { text: metric.title, side: "right", font: { size: 10.5, color: ink } },
              x: geom.metricX, len: 0.55, thickness: 13, y: 0.5,
              tickfont: { size: 10, color: ink }, outlinewidth: 0
            };
          }
        } else {
          line.color = w.color;
        }
        traces.push({
          type: "scatter3d", mode: "lines", name: w.name,
          x: w.idx.map(function (i) { return num(xs[i]); }),
          y: w.idx.map(function (i) { return num(ys[i]); }),
          z: w.idx.map(function (i) { return num(zs[i]); }),
          line: line, opacity: dim ? 0.22 : 1,
          customdata: w.idx.map(function (i) { return customFor(i, m); }),
          hovertemplate: tpl, hoverlabel: { align: "left" },
          showlegend: !metric, legendgroup: w.name
        });
      });

      /* --- frac / completion stage markers --- */
      if (VIEW.showStages && m.stageSize && DATA[m.stageSize]) {
        var sizeAll = [];
        vis.forEach(function (w) { w.full.forEach(function (i) { var v = num(DATA[m.stageSize][i]); if (v != null) sizeAll.push(v); }); });
        var sx = extent(sizeAll), span = (sx[1] - sx[0]) || 1;
        vis.forEach(function (w) {
          var pts = w.full.filter(function (i) { return num(DATA[m.stageSize][i]) != null; });
          if (!pts.length) return;
          var mk = {
            size: pts.map(function (i) {
              return (3.5 + 6.5 * (num(DATA[m.stageSize][i]) - sx[0]) / span) * SETTINGS.view.markerScale;
            }),
            line: { width: 0.5, color: cssv("--surface-1", "#fcfcfb") },
            opacity: 0.88
          };
          if (metric) {
            mk.color = pts.map(function (i) { return num(DATA[m.color][i]); });
            mk.colorscale = metric.s; mk.cmin = metric.lo; mk.cmax = metric.hi; mk.showscale = false;
          } else { mk.color = w.color; }
          traces.push({
            type: "scatter3d", mode: "markers", name: w.name + " stages",
            x: pts.map(function (i) { return num(xs[i]); }),
            y: pts.map(function (i) { return num(ys[i]); }),
            z: pts.map(function (i) { return num(zs[i]); }),
            marker: mk, opacity: selectedWell && selectedWell !== w.name ? 0.2 : 1,
            customdata: pts.map(function (i) {
              var row = customFor(i, m);
              row.push(m.stageLabel && DATA[m.stageLabel] ? String(DATA[m.stageLabel][i]) : "");
              row.push(fmt(num(DATA[m.stageSize][i]), m.stageSize, COLS));
              return row;
            }),
            hovertemplate: "<b>%{customdata[0]}</b> · stage %{customdata[" + (3 + m.tooltip.length) + "]}<br>" +
                           tplSafe(colName(m.stageSize, COLS)) + ": <b>%{customdata[" + (4 + m.tooltip.length) + "]}</b><br>" +
                           (m.md ? tplSafe(colName(m.md, COLS)) + ": %{customdata[1]}<br>" : "") +
                           "<extra></extra>",
            showlegend: false, legendgroup: w.name
          });
        });
      }

      /* --- wellhead direct labels (identity is never colour-alone) --- */
      if (VIEW.showLabels && vis.length) {
        var zSpan = (function () {
          var za = [];
          vis.forEach(function (w) { w.idx.forEach(function (i) { za.push(num(zs[i])); }); });
          var e = extent(za);
          return (e[1] - e[0]) || 1000;
        })();
        traces.push({          // the wellheads themselves
          type: "scatter3d", mode: "markers", name: "Wellheads",
          x: vis.map(function (w) { return num(xs[w.idx[0]]); }),
          y: vis.map(function (w) { return num(ys[w.idx[0]]); }),
          z: vis.map(function (w) { return num(zs[w.idx[0]]); }),
          marker: { size: 4, symbol: "square",
                    color: vis.map(function (w) { return metric ? cssv("--text-muted", "#8a8880") : w.color; }) },
          customdata: vis.map(function (w) { return [w.name]; }),
          hovertemplate: "<b>%{customdata[0]}</b> wellhead<extra></extra>",
          showlegend: false
        });
        traces.push({          // names, lifted and staggered so pad-mates don't overprint
          type: "scatter3d", mode: "text", name: "Well labels",
          x: vis.map(function (w) { return num(xs[w.idx[0]]); }),
          y: vis.map(function (w) { return num(ys[w.idx[0]]); }),
          z: vis.map(function (w, i) { return num(zs[w.idx[0]]) - zSpan * (0.03 + 0.045 * (i % 4)); }),
          text: vis.map(function (w) { return w.name; }),
          textposition: vis.map(function (w, i) {
            return ["middle center", "middle right", "middle left", "middle center"][i % 4];
          }),
          textfont: { size: 10, color: cssv("--text-primary", "#0b0b0b") },
          hoverinfo: "skip", showlegend: false
        });
      }
      return traces;
    }

    /* =====================================================================
       8. Layout
       ===================================================================== */
    function buildLayout(wells) {
      var m = SETTINGS.map;
      var vis = wells.filter(function (w) { return !hiddenWells[w.name]; });
      var X = [], Y = [], Z = [];
      vis.forEach(function (w) {
        w.idx.forEach(function (i) {
          X.push(num(DATA[m.x][i])); Y.push(num(DATA[m.y][i])); Z.push(num(DATA[m.z][i]));
        });
      });
      var s = SETTINGS.surf;
      if (VIEW.showSurface && s.x && SDATA[s.x] && VIEW.layer) {
        var sn = SDATA[s.x].length;
        for (var i = 0; i < sn; i++) {
          if (s.layer && String(SDATA[s.layer][i]) !== VIEW.layer) continue;
          var px = num(SDATA[s.x][i]), py = num(SDATA[s.y][i]), pz = num(SDATA[s.z][i]);
          if (px != null) X.push(px); if (py != null) Y.push(py); if (pz != null) Z.push(pz);
        }
      }
      var ex = extent(X), ey = extent(Y), ez = extent(Z);
      var rx = (ex[1] - ex[0]) || 1, ry = (ey[1] - ey[0]) || 1, rz = (ez[1] - ez[0]) || 1;
      var ar;
      if (VIEW.trueScale) {
        var big = Math.max(rx, ry, rz);
        ar = { x: rx / big, y: ry / big, z: rz / big };
      } else {
        var basis = Math.max(rx, ry);
        ar = { x: clamp(rx / basis, 0.15, 1), y: clamp(ry / basis, 0.15, 1),
               z: clamp(0.85 * VIEW.zExag, 0.1, 4) };
      }
      // Keep the viewer's orbit angle, but refit the distance whenever the cube's shape changes.
      var key = arKey(ar), cam;
      if (VIEW.camera && VIEW.camera.eye) {
        cam = clone(VIEW.camera);
        if (VIEW.camAR !== key) cam.eye = framedEye(cam.eye, ar);
        cam.projection = { type: VIEW.projection };
      } else {
        cam = presetCamera("iso", ar);
      }
      VIEW.camera = cam; VIEW.camAR = key;

      var ink = cssv("--text-secondary", "#52514e");
      var grid = cssv("--line", "#dedcd6");
      var ax = function (title) {
        return {
          title: { text: title, font: { size: 11, color: ink } },
          tickfont: { size: 10, color: ink },
          gridcolor: grid, zerolinecolor: grid,
          showbackground: true, backgroundcolor: cssv("--surface-2", "#f4f3f0"),
          showspikes: false
        };
      };
      var zax = ax(colName(m.z, COLS) + " ↓");
      zax.autorange = "reversed";     // depth increases downward

      var geom = cbGeom();
      var padLeft = panelCollapsed ? 0
        : Math.min(0.36, (panel.offsetWidth + 16) / Math.max(1, stage.clientWidth || 1));
      return {
        margin: { l: 4, r: 4, t: 8, b: 4 },
        paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",
        showlegend: !m.color && vis.length > 1,
        legend: { x: Math.min(0.995, 1 - geom.reserve + 0.02), y: 1, xanchor: "left",
                  font: { size: 11, color: ink }, itemsizing: "constant",
                  bgcolor: "rgba(0,0,0,0)", borderwidth: 0 },
        hoverlabel: { bgcolor: cssv("--surface-1", "#fff"), bordercolor: grid,
                      font: { size: 11.5, color: cssv("--text-primary", "#0b0b0b") } },
        scene: {
          domain: { x: [padLeft, Math.max(padLeft + 0.2, 1 - geom.reserve - (m.color ? 0 : (vis.length > 1 ? 0.09 : 0)))], y: [0, 1] },
          aspectmode: "manual", aspectratio: ar,
          xaxis: ax(colName(m.x, COLS)), yaxis: ax(colName(m.y, COLS)), zaxis: zax,
          camera: cam,
          dragmode: "orbit"
        }
      };
    }

    // Plotly never auto-zooms a 3D scene, so derive the eye distance from the cube's diagonal.
    // Calibrated so the default aspect (≈1 : 0.5 : 0.85) frames the way the presets were tuned.
    function arNorm(a) { return Math.sqrt(a.x * a.x + a.y * a.y + a.z * a.z); }
    function arKey(a) { return a.x.toFixed(3) + "|" + a.y.toFixed(3) + "|" + a.z.toFixed(3); }
    function framedEye(dir, ar) {
      var d = Math.sqrt(dir.x * dir.x + dir.y * dir.y + dir.z * dir.z) || 1;
      var dist = 1.43 * arNorm(ar);
      return { x: dir.x / d * dist, y: dir.y / d * dist, z: dir.z / d * dist };
    }
    function presetCamera(which, ar) {
      var pre = CAMS[which] || CAMS.iso;
      return { eye: framedEye(pre.eye, ar), up: pre.up, projection: { type: VIEW.projection } };
    }

    var PLOT_CFG = {
      responsive: true, displaylogo: false, doubleClick: "reset",
      modeBarButtonsToRemove: ["hoverClosest3d", "resetCameraLastSave3d"],
      toImageButtonOptions: { filename: "well-3d", scale: 2 }
    };

    /* =====================================================================
       9. Render
       ===================================================================== */
    function renderPlot() {
      if (!window.Plotly) return;
      var m = SETTINGS.map;
      if (!m.x || !m.y || !m.z || !DATA[m.x] || !DATA[m.y] || !DATA[m.z]) {
        plotReady = false;
        Plotly.purge(plotEl);
        var mapped = !!(m.x && m.y && m.z);
        if (!inSigma) {
          showMsg("Loading demo wells…", "");
        } else if (!CONFIG.source) {
          showMsg("Pick a data source",
            "Choose your well-survey element in the plugin panel, then turn on <b>Edit mode</b> to map " +
            "<code>Easting</code>, <code>Northing</code> and <code>TVD</code>.");
        } else if (mapped) {
          // configured correctly — Sigma just hasn't delivered the columns yet
          showMsg("Waiting for survey data…",
            "The geometry is mapped; Sigma is still sending <code>" + esc(colName(m.x, COLS)) + "</code>, " +
            "<code>" + esc(colName(m.y, COLS)) + "</code> and <code>" + esc(colName(m.z, COLS)) + "</code>. " +
            "If this persists, re-save the mapping in <b>Edit mode</b> so the columns get registered.");
        } else {
          showMsg("Map the survey geometry",
            "Turn on <b>Edit mode</b> and map <code>Easting</code>, <code>Northing</code> and <code>TVD</code>. " +
            "Flip on <b>Use built-in demo wells</b> to see the viewer with sample data.");
        }
        return;
      }
      hideMsg();
      var wells = buildWells();
      if (!wells.length) {
        Plotly.purge(plotEl); plotReady = false;
        showMsg("No plottable rows", "Every row is missing at least one of Easting / Northing / TVD.");
        return;
      }
      var traces = buildTraces(wells);
      var layout = buildLayout(wells);
      var draw = plotReady ? Plotly.react(plotEl, traces, layout, PLOT_CFG)
                           : Plotly.newPlot(plotEl, traces, layout, PLOT_CFG);
      draw.then(function () {
        endLoading();
        if (!plotReady) {
          plotReady = true;
          lastW = stage.clientWidth; lastH = stage.clientHeight;
          plotEl.on("plotly_click", onPointClick);
          plotEl.on("plotly_relayout", function (e) {
            if (e && e["scene.camera"]) VIEW.camera = e["scene.camera"];
          });
        }
      });
      renderPanel(wells);
      renderChip();
    }

    function onPointClick(ev) {
      var p = ev && ev.points && ev.points[0];
      if (!p || !Array.isArray(p.customdata)) return;
      clickedAt = Date.now();
      toggleSelected(p.customdata[0]);
    }
    // Plotly does not reliably emit plotly_click (or plotly_hover) on WebGL 3D subplots, but the
    // scene's pick buffer — the same one that draws the hover label — is always current. Read it
    // directly, and only trust it when its own mouse position matches this click.
    function pickWell(ev) {
      try {
        var sc = plotEl._fullLayout && plotEl._fullLayout.scene && plotEl._fullLayout.scene._scene;
        var sel = sc && sc.glplot && sc.glplot.selection;
        if (!sel || !sel.object || !sel.object._trace || !sel.mouse) return null;
        var cv = plotEl.querySelector("canvas");
        if (!cv) return null;
        var r = cv.getBoundingClientRect();
        if (Math.abs(ev.clientX - r.left - sel.mouse[0]) > 8 ||
            Math.abs(ev.clientY - r.top - sel.mouse[1]) > 8) return null;   // stale pick
        var cd = sel.object._trace.data.customdata;
        var i = sel.data && sel.data.index;
        if (cd && i != null && cd[i] && cd[i][0]) return String(cd[i][0]);
      } catch (e) { /* internals moved — the well list still selects */ }
      return null;
    }
    plotEl.addEventListener("click", function (ev) {
      if (Date.now() - clickedAt < 400) return;          // plotly_click already handled it
      toggleSelected(pickWell(ev));
    });
    function toggleSelected(w) {
      if (!w) return;
      setSelected(selectedWell === w ? null : w);
    }
    function setSelected(w) {
      selectedWell = w;
      if (inSigma) {
        try {
          if (CONFIG.wellVar) client.config.setVariable("wellVar", String(w || ""));
          if (CONFIG.onSelect) client.config.triggerAction("onSelect");
        } catch (e) { console.warn("select writeback failed", e); }
      }
      renderPlot();
    }
    function renderChip() {
      if (!selectedWell) { selchip.classList.remove("show"); return; }
      selchip.innerHTML = "Selected <b>" + esc(selectedWell) + "</b><button title='Clear'>✕</button>";
      selchip.querySelector("button").onclick = function () { setSelected(null); };
      selchip.classList.add("show");
    }

    /* =====================================================================
       10. Viewer control panel
       ===================================================================== */
    document.getElementById("panelHead").onclick = function () {
      panelCollapsed = !panelCollapsed;
      panel.classList.toggle("collapsed", panelCollapsed);
      panel.querySelector(".caret").textContent = panelCollapsed ? "▸" : "▾";
      if (plotReady && window.Plotly) Plotly.relayout(plotEl, { "scene.domain": buildLayout(buildWells()).scene.domain });
    };

    function renderPanel(wells) {
      var layers = layerValues();
      var h = "";

      if (layers.length) {
        h += '<div class="fld"><label>Formation layer</label><select id="pLayer">' +
             '<option value="">— none —</option>' +
             layers.map(function (l) {
               return '<option value="' + esc(l) + '"' + (l === VIEW.layer ? " selected" : "") + ">" + esc(l) + "</option>";
             }).join("") + "</select></div>";
      }
      if (SETTINGS.map.color) {
        h += '<div class="fld"><label>Colour scale — ' + esc(colName(SETTINGS.map.color, COLS)) + '</label>' +
             '<select id="pScale">' +
             ['<option value="auto">Auto</option>',
              '<option value="seq">Sequential (magnitude)</option>',
              '<option value="div">Diverging (± around 0)</option>'].join("") +
             "</select></div>";
      }
      h += '<div class="fld"><div class="rowline"><label>Depth exaggeration</label>' +
           '<span class="val" id="pExagV">' + VIEW.zExag.toFixed(1) + "×</span></div>" +
           '<input type="range" id="pExag" min="0.2" max="3" step="0.1" value="' + VIEW.zExag + '"' +
           (VIEW.trueScale ? " disabled" : "") + "></div>";

      h += '<div class="fld"><label>Camera</label><div class="btnrow">' +
           '<button class="btn" data-cam="iso">Iso</button>' +
           '<button class="btn" data-cam="plan">Plan</button>' +
           '<button class="btn" data-cam="section">Section</button></div></div>';

      h += "<div>" +
           chk("pTrue", "True scale (1:1:1)", VIEW.trueScale) +
           chk("pOrtho", "Orthographic", VIEW.projection === "orthographic") +
           (SETTINGS.map.stageSize ? chk("pStages", "Completion stages", VIEW.showStages) : "") +
           (SETTINGS.surf.x ? chk("pSurf", "Formation surface", VIEW.showSurface) : "") +
           chk("pLabels", "Well labels", VIEW.showLabels) +
           chk("pFoot", "Plan-view footprint", VIEW.showFootprint) +
           "</div>";

      if (wells.length > 1) {
        h += '<div class="fld"><div class="rowline"><label>Wells (' +
             wells.filter(function (w) { return !hiddenWells[w.name]; }).length + "/" + wells.length + ")</label>" +
             '<button class="btn" id="pAll" style="padding:2px 6px;font-size:11px">All</button></div>' +
             '<div class="wells">' + wells.map(function (w) {
               return '<div class="w' + (hiddenWells[w.name] ? " off" : "") +
                      (selectedWell === w.name ? " sel" : "") + '" data-w="' + esc(w.name) + '">' +
                      '<input type="checkbox" class="vis" title="Show / hide"' +
                      (hiddenWells[w.name] ? "" : " checked") + ">" +
                      '<span class="sw" style="background:' + (SETTINGS.map.color ? "var(--text-muted)" : w.color) + '"></span>' +
                      '<span class="nm" title="Select">' + esc(w.name) + "</span></div>";
             }).join("") + "</div>" +
             '<div class="hint">Tick to show/hide · click a name (or a trajectory) to select' +
             (wells.length > 8 && !SETTINGS.map.color
               ? " · 9+ wells share the neutral colour — colour by a metric or filter down"
               : "") + "</div></div>";
      }
      if (inSigma && CONFIG.editMode) {
        h += '<button class="btn primary" id="pSaveView">Save view as default</button>';
      }
      panelBody.innerHTML = h;
      wirePanel(wells);
    }

    function chk(id, label, on) {
      return '<label class="chk"><input type="checkbox" id="' + id + '"' + (on ? " checked" : "") + ">" +
             esc(label) + "</label>";
    }

    var CAMS = {              // eye vectors are directions only; distance comes from framedEye()
      iso:     { eye: { x: 1.27, y: -1.40, z: 0.64 }, up: { x: 0, y: 0, z: 1 } },
      plan:    { eye: { x: 0, y: 0, z: 2.05 },        up: { x: 0, y: 1, z: 0 } },
      section: { eye: { x: 0, y: -2.1, z: 0.04 },     up: { x: 0, y: 0, z: 1 } }
    };

    function wirePanel(wells) {
      var g = function (id) { return document.getElementById(id); };
      var set = function (fn) { return function () { fn(); renderPlot(); }; };

      if (g("pLayer")) g("pLayer").onchange = set(function () {
        VIEW.layer = g("pLayer").value;
        if (inSigma && CONFIG.layerVar) {
          try { client.config.setVariable("layerVar", String(VIEW.layer || "")); } catch (e) {}
        }
      });
      if (g("pScale")) { g("pScale").value = VIEW.scale; g("pScale").onchange = set(function () { VIEW.scale = g("pScale").value; }); }
      if (g("pExag")) {
        g("pExag").oninput = function () {
          VIEW.zExag = +g("pExag").value;
          g("pExagV").textContent = VIEW.zExag.toFixed(1) + "×";
          if (plotReady) {
            var L = buildLayout(buildWells()).scene;
            Plotly.relayout(plotEl, { "scene.aspectratio": L.aspectratio, "scene.camera": L.camera });
          }
        };
      }
      ["pTrue:trueScale", "pStages:showStages", "pSurf:showSurface", "pLabels:showLabels", "pFoot:showFootprint"]
        .forEach(function (pair) {
          var p = pair.split(":"), el = g(p[0]);
          if (el) el.onchange = set(function () { VIEW[p[1]] = el.checked; });
        });
      if (g("pOrtho")) g("pOrtho").onchange = set(function () {
        VIEW.projection = g("pOrtho").checked ? "orthographic" : "perspective";
        if (VIEW.camera) VIEW.camera.projection = { type: VIEW.projection };
      });
      panelBody.querySelectorAll("[data-cam]").forEach(function (b) {
        b.onclick = function () {
          var ar = buildLayout(buildWells()).scene.aspectratio;
          VIEW.camera = presetCamera(b.getAttribute("data-cam"), ar);
          VIEW.camAR = arKey(ar);
          if (plotReady) Plotly.relayout(plotEl, { "scene.camera": VIEW.camera });
        };
      });
      panelBody.querySelectorAll(".wells .w").forEach(function (row) {
        var n = row.getAttribute("data-w");
        row.querySelector("input.vis").onchange = function () {
          if (this.checked) delete hiddenWells[n]; else hiddenWells[n] = 1;
          renderPlot();
        };
        row.querySelector(".nm").onclick = function () { toggleSelected(n); };
      });
      if (g("pAll")) g("pAll").onclick = set(function () { hiddenWells = {}; });
      if (g("pSaveView")) g("pSaveView").onclick = function () {
        SETTINGS.view = deepMerge(SETTINGS.view, {
          zExag: VIEW.zExag, trueScale: VIEW.trueScale, scale: VIEW.scale,
          showStages: VIEW.showStages, showSurface: VIEW.showSurface,
          showLabels: VIEW.showLabels, showFootprint: VIEW.showFootprint,
          projection: VIEW.projection, layer: VIEW.layer, camera: VIEW.camera
        });
        saveSettings();
        g("pSaveView").textContent = "Saved ✓";
        setTimeout(function () { if (g("pSaveView")) g("pSaveView").textContent = "Save view as default"; }, 1400);
      };
    }

    /* =====================================================================
       11. Author toolbar — column mapping
       ===================================================================== */
    var SURVEY_FIELDS = [
      ["well", "Well / UWI", null],
      ["x", "Easting / X", ["number", "integer"]],
      ["y", "Northing / Y", ["number", "integer"]],
      ["z", "TVD / depth", ["number", "integer"]],
      ["md", "Measured depth (order)", ["number", "integer"]],
      ["color", "Colour by metric", ["number", "integer"]],
      ["stageSize", "Stage size metric", ["number", "integer"]],
      ["stageLabel", "Stage label", null]
    ];
    var SURF_FIELDS = [
      ["layer", "Layer / formation", null],
      ["x", "Easting / X", ["number", "integer"]],
      ["y", "Northing / Y", ["number", "integer"]],
      ["z", "Top depth (TVD)", ["number", "integer"]],
      ["value", "Colour by metric", ["number", "integer"]]
    ];

    function optionsFor(meta, selected, types) {
      var ids = Object.keys(meta || {});
      var h = '<option value="">— none —</option>';
      ids.forEach(function (id) {
        var ct = (meta[id].columnType || "").toLowerCase();
        if (types && types.indexOf(ct) < 0 && ct) return;
        h += '<option value="' + esc(id) + '"' + (id === selected ? " selected" : "") + ">" +
             esc(meta[id].name || id) + "</option>";
      });
      if (selected && ids.indexOf(selected) < 0)
        h += '<option value="' + esc(selected) + '" selected>' + esc(selected) + " (missing)</option>";
      return h;
    }

    function renderToolbar() {
      var on = inSigma && !!CONFIG.editMode;
      toolbar.classList.toggle("show", on);
      if (!on) { toolbar.innerHTML = ""; return; }
      var h = '<div class="sec">Well survey — one row per survey station</div><div class="row">';
      SURVEY_FIELDS.forEach(function (f) {
        h += '<div class="grp"><span>' + esc(f[1]) + '</span><select data-m="' + f[0] + '">' +
             optionsFor(COLS, SETTINGS.map[f[0]], f[2]) + "</select></div>";
      });
      h += '<div class="grp"><span>Extra hover columns</span><select data-tip multiple size="3" style="min-width:150px">' +
           Object.keys(COLS).map(function (id) {
             return '<option value="' + esc(id) + '"' +
                    (SETTINGS.map.tooltip.indexOf(id) >= 0 ? " selected" : "") + ">" +
                    esc(COLS[id].name || id) + "</option>";
           }).join("") + "</select></div>";
      h += "</div>";

      if (Object.keys(SCOLS).length) {
        h += '<div class="sec">Formation grid — one row per grid node (optional)</div><div class="row">';
        SURF_FIELDS.forEach(function (f) {
          h += '<div class="grp"><span>' + esc(f[1]) + '</span><select data-s="' + f[0] + '">' +
               optionsFor(SCOLS, SETTINGS.surf[f[0]], f[2]) + "</select></div>";
        });
        h += "</div>";
      }
      h += '<div class="row" style="margin-top:9px">' +
           '<div class="grp"><span>Line width</span><input type="number" id="tbLW" min="1" max="14" step="1" value="' +
           SETTINGS.view.lineWidth + '" style="width:70px"></div>' +
           '<div class="grp"><span>Marker scale</span><input type="number" id="tbMS" min="0.3" max="3" step="0.1" value="' +
           SETTINGS.view.markerScale + '" style="width:70px"></div>' +
           '<div class="spacer"></div>' +
           '<button class="btn" id="tbAuto">Auto-map columns</button>' +
           (demoMode
             ? '<span class="hint">Demo data is on — turn it off to map and save your own columns.</span>'
             : '<button class="btn primary" id="tbSave">Save mapping</button>') + "</div>";
      toolbar.innerHTML = h;

      toolbar.querySelectorAll("select[data-m]").forEach(function (s) {
        s.onchange = function () { SETTINGS.map[s.getAttribute("data-m")] = s.value; renderPlot(); };
      });
      toolbar.querySelectorAll("select[data-s]").forEach(function (s) {
        s.onchange = function () {
          SETTINGS.surf[s.getAttribute("data-s")] = s.value;
          if (s.getAttribute("data-s") === "layer") VIEW.layer = layerValues()[0] || "";
          renderPlot();
        };
      });
      var tip = toolbar.querySelector("select[data-tip]");
      if (tip) tip.onchange = function () {
        SETTINGS.map.tooltip = Array.prototype.slice.call(tip.selectedOptions).map(function (o) { return o.value; });
        renderPlot();
      };
      var lw = document.getElementById("tbLW"), ms = document.getElementById("tbMS");
      lw.onchange = function () { SETTINGS.view.lineWidth = clamp(+lw.value || 5, 1, 14); renderPlot(); };
      ms.onchange = function () { SETTINGS.view.markerScale = clamp(+ms.value || 1, 0.3, 3); renderPlot(); };
      document.getElementById("tbAuto").onclick = function () { autoMap(true); renderToolbar(); renderPlot(); };
      var save = document.getElementById("tbSave");
      if (save) save.onclick = function () {
        saveSettings();
        save.textContent = "Saved ✓";
        setTimeout(function () { renderToolbar(); }, 1300);
      };
    }

    /* =====================================================================
       12. Auto-mapping by column name
       ===================================================================== */
    function guess(meta, patterns, types, used) {
      var ids = Object.keys(meta || {});
      for (var p = 0; p < patterns.length; p++) {
        for (var i = 0; i < ids.length; i++) {
          var id = ids[i], nm = String(meta[id].name || id).toLowerCase();
          var ct = (meta[id].columnType || "").toLowerCase();
          if (used && used[id]) continue;
          if (types && ct && types.indexOf(ct) < 0) continue;
          if (patterns[p].test(nm)) { if (used) used[id] = 1; return id; }
        }
      }
      return "";
    }
    function autoMap(force) {
      var NUM = ["number", "integer"], used = {};
      var m = SETTINGS.map;
      function fill(key, pats, types) {
        if (!force && m[key]) { used[m[key]] = 1; return; }
        var g = guess(COLS, pats, types, used);
        if (g) m[key] = g;
      }
      fill("well", [/\b(well|uwi|api|borehole|wellbore)\b/, /well/], null);
      fill("x", [/\beast(ing)?\b/, /^x\b/, /\bx[_ ]?(coord|utm|loc)/, /\blongitude\b/], NUM);
      fill("y", [/\bnorth(ing)?\b/, /^y\b/, /\by[_ ]?(coord|utm|loc)/, /\blatitude\b/], NUM);
      fill("z", [/\btvd(ss)?\b/, /\btrue vertical\b/, /\bdepth\b/, /\bsubsea\b/, /^z\b/], NUM);
      fill("md", [/\bmd\b/, /\bmeasured depth\b/, /\bhole depth\b/], NUM);
      fill("color", [/\b(dls|dogleg)\b/, /\bbuild rate\b/, /\bturn rate\b/, /\brop\b/,
                     /\bwob\b/, /\btorque\b/, /\bgamma\b/, /\bporosity\b/], NUM);
      fill("stageSize", [/\bproppant\b/, /\bsand\b/, /\bfluid\b/, /\bslurry\b/, /\bstage volume\b/], NUM);
      fill("stageLabel", [/\bstage\b/, /\bcluster\b/], null);
      var s = SETTINGS.surf, sused = {};
      function sfill(key, pats, types) {
        if (!force && s[key]) { sused[s[key]] = 1; return; }
        var g = guess(SCOLS, pats, types, sused);
        if (g) s[key] = g;
      }
      sfill("layer", [/\b(formation|layer|zone|horizon|marker|interval)\b/], null);
      sfill("x", [/\beast(ing)?\b/, /^x\b/, /\blongitude\b/], NUM);
      sfill("y", [/\bnorth(ing)?\b/, /^y\b/, /\blatitude\b/], NUM);
      sfill("z", [/\btop\b/, /\btvd(ss)?\b/, /\bdepth\b/, /^z\b/], NUM);
      sfill("value", [/\brate\b/, /\bthickness\b/, /\bporosity\b/, /\bpressure\b/, /\bgrade\b/, /\bvalue\b/], NUM);
      if (!VIEW.layer) VIEW.layer = layerValues()[0] || "";
    }

    /* =====================================================================
       13. Settings persistence + column auto-registration
       ===================================================================== */
    function loadSettings(txt) {
      var out = clone(DEFAULTS);
      if (txt && txt.trim()) {
        try { out = deepMerge(DEFAULTS, JSON.parse(txt)); }
        catch (e) { console.warn("bad viewer config JSON — using defaults", e); }
      }
      if (!Array.isArray(out.map.tooltip)) out.map.tooltip = [];
      return out;
    }
    function saveSettings() {
      if (!inSigma) return;
      try { client.config.setKey("config", JSON.stringify(SETTINGS, null, 2)); }
      catch (e) { console.warn("save failed", e); }
    }
    // Sigma only delivers data for columns declared in the panel — register whatever the mapping uses.
    function syncColumns() {
      if (!inSigma || demoMode) return;
      var want = {}, cur = arr(CONFIG.columns);
      cur.forEach(function (c) { want[c] = 1; });
      var m = SETTINGS.map;
      [m.well, m.x, m.y, m.z, m.md, m.color, m.stageSize, m.stageLabel].forEach(function (c) { if (c) want[c] = 1; });
      m.tooltip.forEach(function (c) { if (c) want[c] = 1; });
      var ids = Object.keys(want);
      if (ids.length !== cur.length || ids.some(function (i) { return cur.indexOf(i) < 0; })) {
        try { client.config.setKey("columns", ids); } catch (e) { console.warn("column register failed", e); }
      }
      var swant = {}, scur = arr(CONFIG.surfaceColumns);
      scur.forEach(function (c) { swant[c] = 1; });
      var s = SETTINGS.surf;
      [s.layer, s.x, s.y, s.z, s.value].forEach(function (c) { if (c) swant[c] = 1; });
      var sids = Object.keys(swant);
      if (sids.length && (sids.length !== scur.length || sids.some(function (i) { return scur.indexOf(i) < 0; }))) {
        try { client.config.setKey("surfaceColumns", sids); } catch (e) { console.warn("surface column register failed", e); }
      }
    }

    /* =====================================================================
       14. Wiring
       ===================================================================== */
    function useDemo() {
      buildDemo();
      demoMode = true;
      COLS = DEMO_COLS; DATA = DEMO;
      SCOLS = DEMO_SCOLS; SDATA = DEMO_S;
      SETTINGS = deepMerge(SETTINGS, DEMO_MAP);
      if (!VIEW.layer) VIEW.layer = layerValues()[0] || "";
    }

    function boot() {
      if (!inSigma) {                     // opened standalone → demo mode preview
        useDemo();
        renderToolbar(); renderPlot();
        return;
      }
      // If we're inside an iframe that isn't Sigma, nothing would ever render — preview instead.
      setTimeout(function () {
        if (gotConfig) return;
        useDemo(); renderToolbar(); renderPlot();
      }, 3000);
      client.config.subscribe(function (cfg) {
        gotConfig = true;
        CONFIG = cfg || {};
        SETTINGS = loadSettings(CONFIG.config);
        VIEW = deepMerge(SETTINGS.view, {
          zExag: VIEW.zExag !== DEFAULTS.view.zExag ? VIEW.zExag : SETTINGS.view.zExag,
          layer: VIEW.layer || SETTINGS.view.layer, camera: VIEW.camera || SETTINGS.view.camera
        });
        if (CONFIG.demo) {
          useDemo();
        } else {
          if (demoMode) { demoMode = false; COLS = {}; DATA = {}; SCOLS = {}; SDATA = {}; autoMapped = false; }
          resubscribe(CONFIG.source, CONFIG.surfaceSource);
        }
        renderToolbar();
        renderPlot();
      });
    }

    function resubscribe(src, ssrc) {
      if (src !== curSrc) {
        if (unsubD) { unsubD(); unsubD = null; }
        if (unsubC) { unsubC(); unsubC = null; }
        curSrc = src; COLS = {}; DATA = {}; autoMapped = false; colsSynced = false;
        if (src) {
          unsubC = client.elements.subscribeToElementColumns(src, function (c) {
            COLS = c || {};
            if (!autoMapped && Object.keys(COLS).length) { autoMap(false); autoMapped = true; }
            syncColumns();
            renderToolbar(); renderPlot();
          });
          beginLoading();
          unsubD = client.elements.subscribeToElementData(src, function (d) {
            DATA = d || {};
            if (Object.keys(DATA).length) endLoading();
            renderPlot();
          });
        }
      }
      if (ssrc !== curSurfSrc) {
        if (unsubSD) { unsubSD(); unsubSD = null; }
        if (unsubSC) { unsubSC(); unsubSC = null; }
        curSurfSrc = ssrc; SCOLS = {}; SDATA = {};
        if (ssrc) {
          unsubSC = client.elements.subscribeToElementColumns(ssrc, function (c) {
            SCOLS = c || {};
            autoMap(false); syncColumns();
            renderToolbar(); renderPlot();
          });
          unsubSD = client.elements.subscribeToElementData(ssrc, function (d) {
            SDATA = d || {};
            if (!VIEW.layer) VIEW.layer = layerValues()[0] || "";
            renderPlot();
          });
        }
      }
    }

    // Sigma sizes the iframe after first paint. Plots.resize alone updates the paper but leaves
    // the WebGL scene fitted to the old box, so follow it with a full (debounced) redraw.
    var lastW = 0, lastH = 0, rzT = null;
    function onResize() {
      if (!plotReady || !window.Plotly) return;
      var w = stage.clientWidth, h = stage.clientHeight;
      if (w === lastW && h === lastH) return;
      lastW = w; lastH = h;
      Plotly.Plots.resize(plotEl);
      clearTimeout(rzT);
      rzT = setTimeout(function () {
        if (!window.Plotly) return;
        plotReady = false; Plotly.purge(plotEl); renderPlot();
      }, 200);
    }
    if (window.ResizeObserver) new ResizeObserver(onResize).observe(stage);
    window.addEventListener("resize", onResize);
    if (window.matchMedia) {
      try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () { renderPlot(); }); }
      catch (e) {}
    }

    ensurePlotly(boot);
  })();
  </script>
</body>
</html>
